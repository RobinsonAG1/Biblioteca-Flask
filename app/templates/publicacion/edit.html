{% extends "base.html" %}
{% block titulo_pagina %}Editar Publicación: {{ publicacion.titulo }}{% endblock %}
{% block content %}
<form action="{{ url_for('publicacion.edit', id=publicacion.id) }}" method="post" class="needs-validation" novalidate>
    <div class="form-group mb-3">
        <label for="titulo" class="form-label">Título:</label>
        <input type="text" id="titulo" name="titulo" value="{{ publicacion.titulo }}" required class="form-control">
        <div class="invalid-feedback">
            Por favor, ingrese un título.
        </div>
    </div>

    <div class="form-group mb-3">
        <label for="contenido" class="form-label">Contenido:</label>
        <textarea id="contenido" name="contenido" required class="form-control" rows="5">{{ publicacion.contenido }}</textarea>
        <div class="invalid-feedback">
            Por favor, ingrese el contenido.
        </div>
    </div>

    <div class="form-group mb-3">
        <label for="etiquetas" class="form-label">Etiquetas:</label>
        <select id="etiquetas" name="etiquetas" multiple class="form-control">
            {% for etiqueta in etiquetas %}
                <option value="{{ etiqueta.id }}" {% if etiqueta in publicacion.etiquetas %}selected{% endif %}>{{ etiqueta.nombre }}</option>
            {% endfor %}
        </select>
        <small class="form-text text-muted">Mantén presionado Ctrl (o Cmd en Mac) para seleccionar múltiples etiquetas.</small>
    </div>

    <button type="submit" class="btn btn-primary">Actualizar Publicación</button>
    <a href="{{ url_for('publicacion.index') }}" class="btn btn-secondary ms-2">Cancelar</a>
</form>

{% endblock %}
